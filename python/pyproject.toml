[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madnessproject"
version = "0.0.0"
description = "Object-based Python API for MADNESS calculations — mirrors daltonproject"
requires-python = ">=3.10"
dependencies = ["numpy", "qcelemental"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["madnessproject*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
